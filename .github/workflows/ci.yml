name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shared-types-and-api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ledgerloop_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledgerloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgerloop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Create restricted runtime role for RLS tests
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE ledgerloop_app NOLOGIN NOSUPERUSER NOBYPASSRLS;"
      - name: Apply database migrations
        run: npm run db:migrate --workspace @ledgerloop/api
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck --workspace @ledgerloop/web
      - run: npm run build --workspace @ledgerloop/web
